packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

# Notifications 9.7.4 is the latest published package; core and hooks are 9.7.5.
# Mantine patch versions are compatible, and this keeps the peer check clean.
peerDependencyRules:
  allowedVersions:
    "@mantine/notifications>@mantine/core": "9.7.5"
    "@mantine/notifications>@mantine/hooks": "9.7.5"

minimumReleaseAgeExclude:
  - "@oxlint/binding-android-arm-eabi@1.93.0"
  - "@oxlint/binding-android-arm64@1.93.0"
  - "@oxlint/binding-darwin-arm64@1.93.0"
  - "@oxlint/binding-darwin-x64@1.93.0"
  - "@oxlint/binding-freebsd-x64@1.93.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.93.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.93.0"
  - "@oxlint/binding-linux-arm64-gnu@1.93.0"
  - "@oxlint/binding-linux-arm64-musl@1.93.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.93.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.93.0"
  - "@oxlint/binding-linux-riscv64-musl@1.93.0"
  - "@oxlint/binding-linux-s390x-gnu@1.93.0"
  - "@oxlint/binding-linux-x64-gnu@1.93.0"
  - "@oxlint/binding-linux-x64-musl@1.93.0"
  - "@oxlint/binding-openharmony-arm64@1.93.0"
  - "@oxlint/binding-win32-arm64-msvc@1.93.0"
  - "@oxlint/binding-win32-ia32-msvc@1.93.0"
  - "@oxlint/binding-win32-x64-msvc@1.93.0"
  - "@rolldown/binding-android-arm-eabi@1.2.18"
  - "@rolldown/binding-android-arm64@1.2.18"
  - "@rolldown/binding-darwin-arm64@1.2.18"
  - "@rolldown/binding-darwin-x64@1.2.18"
  - "@rolldown/binding-freebsd-x64@1.2.18"
  - "@rolldown/binding-linux-arm-gnueabihf@1.2.18"
  - "@rolldown/binding-linux-arm64-gnu@1.2.18"
  - "@rolldown/binding-linux-arm64-musl@1.2.18"
  - "@rolldown/binding-linux-ppc64-gnu@1.2.18"
  - "@rolldown/binding-linux-s390x-gnu@1.2.18"
  - "@rolldown/binding-linux-x64-gnu@1.2.18"
  - "@rolldown/binding-linux-x64-musl@1.2.18"
  - "@rolldown/binding-openharmony-arm64@1.2.18"
  - "@rolldown/binding-win32-arm64-msvc@1.2.18"
  - "@rolldown/binding-win32-x64-msvc@1.2.18"
  - "@vitejs/plugin-react@6.3.0"
  - oxlint@1.93.0
  - rolldown@1.2.18
  - vite@8.3.7
