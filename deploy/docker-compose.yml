# Nando — servizi di infrastruttura sulla VPS.
# Copia live: /srv/nando/compose/docker-compose.yml (questo file è la sorgente di verità).
#
# Nessuna porta pubblicata su 0.0.0.0: l'unico ingresso è Cloudflare Tunnel.
#
# name: fissa il nome del progetto Compose. Senza, deriverebbe dal nome della
# directory ("compose") e gli script che girano da un'altra cwd vedrebbero un
# progetto diverso — cioè un secondo container db sullo stesso volume.
# Lo staging lo sovrascrive con `docker compose -p nando-staging`.

name: nando

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: nando-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
      -c max_connections=100
      -c wal_compression=on
      -c checkpoint_timeout=15min
      -c max_wal_size=4GB
      -c log_min_duration_statement=500
      -c shared_preload_libraries=pg_stat_statements
    volumes:
      - nando_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nando_pgdata:
    name: nando_pgdata
