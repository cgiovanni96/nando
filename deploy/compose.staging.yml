name: nando-staging

# Staging è posseduto da Dokploy. L'immagine è la stessa della produzione.
# Le variabili arrivano dall'ambiente del compose in Dokploy; il workflow di
# deploy aggiorna IMAGE_TAG via API. La password Postgres deve essere
# alfanumerica (esadecimale) perché entra nella DATABASE_URL.

# L'immagine ha un solo CMD (web): ogni servizio deve dichiarare il proprio
# `command`, altrimenti api e worker eseguono il server web.
x-app: &app
  image: ghcr.io/cgiovanni96/nando:${IMAGE_TAG:?IMAGE_TAG required}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nando_staging}"
      POSTGRES_USER: "${POSTGRES_USER:-nando}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=50
      -c wal_compression=on
      -c log_min_duration_statement=500
    volumes:
      - nando_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nando} -d ${POSTGRES_DB:-nando_staging}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://${POSTGRES_USER:-nando}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-nando_staging}"
      OWNER_USER_ID: "${OWNER_USER_ID:?OWNER_USER_ID required}"
      MIGRATIONS_DIR: /app/migrations
    command: ["node", "/app/api/migrate.mjs"]

  api:
    <<: *app
    command: ["node", "/app/api/index.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-nando}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-nando_staging}"
      OWNER_USER_ID: "${OWNER_USER_ID:?OWNER_USER_ID required}"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:?INTERNAL_TOKEN required}"
      DOCS_ENABLED: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    <<: *app
    command: ["node", "/app/web/server/index.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3002"
      API_URL: http://api:3000
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:?INTERNAL_TOKEN required}"
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "/app/worker/index.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://${POSTGRES_USER:-nando}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/${POSTGRES_DB:-nando_staging}"
      OWNER_USER_ID: "${OWNER_USER_ID:?OWNER_USER_ID required}"

volumes:
  nando_staging_pgdata:
    name: nando_staging_pgdata
